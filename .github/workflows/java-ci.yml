name: Java Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run tests
        run: mvn -B --no-transfer-progress test
      - name: Verify tests were executed
        run: |
          python3 - <<'PY'
          from glob import glob
          from xml.etree import ElementTree

          reports = glob("target/surefire-reports/TEST-*.xml")
          if not reports:
              raise SystemExit("No Surefire test reports were generated")

          total = sum(int(ElementTree.parse(report).getroot().get("tests", "0"))
                      for report in reports)
          if total == 0:
              raise SystemExit("Surefire generated reports, but no tests were executed")

          print(f"Verified {total} test(s) ran.")
          PY
